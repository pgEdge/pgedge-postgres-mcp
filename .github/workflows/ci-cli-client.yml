name: CI - CLI Client

on:
    push:
        branches: [ main, develop, 'feat/llm-lib-*' ]
    pull_request:
        branches: [ main, develop, 'feat/llm-lib-*' ]

jobs:
    cli-client:
        name: CLI Client
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Set up Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
              with:
                  go-version: '1.26'
                  cache: false

            - name: Cache Go modules
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: |
                      ~/go/pkg/mod
                      ~/.cache/go-build
                  key: ${{ runner.os }}-go-1.26-${{ hashFiles('**/go.sum') }}
                  restore-keys: |
                      ${{ runner.os }}-go-1.26-

            - name: Verify dependencies
              run: go mod verify

            - name: Download dependencies
              run: go mod download

            - name: Lint client code
              uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
              with:
                  version: v2.12.2
                  args: --timeout=5m ./internal/chat/... ./cmd/pgedge-pg-mcp-cli/...

            - name: Run go vet
              run: go vet ./internal/chat/... ./cmd/pgedge-pg-mcp-cli/...

            - name: Check formatting
              run: |
                  gofmt -l ./internal/chat ./cmd/pgedge-pg-mcp-cli > /tmp/gofmt.out
                  if [ -s /tmp/gofmt.out ]; then
                    echo "The following files are not formatted:"
                    cat /tmp/gofmt.out
                    exit 1
                  fi

            - name: Build client
              run: |
                  mkdir -p bin
                  go build -v -o bin/pgedge-nla-cli ./cmd/pgedge-pg-mcp-cli

            - name: Verify binary
              run: |
                  ls -lh bin/pgedge-nla-cli
                  file bin/pgedge-nla-cli

            - name: Run client unit tests
              run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./internal/chat/... ./cmd/pgedge-pg-mcp-cli/...

            - name: Generate coverage report
              run: |
                  go tool cover -html=coverage.out -o coverage-client.html
                  go tool cover -func=coverage.out

            - name: Upload build artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: pgedge-nla-cli-linux-amd64
                  path: bin/pgedge-nla-cli
                  retention-days: 7

            - name: Upload coverage artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: coverage-client
                  path: |
                      coverage-client.html
                      coverage.out
                  retention-days: 7
