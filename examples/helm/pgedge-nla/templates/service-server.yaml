apiVersion: v1
kind: Service
metadata:
  # The web image's nginx proxies to postgres-mcp:8080, so the name and port
  # are fixed, which also limits the chart to one release per namespace.
  name: postgres-mcp
  labels:
    {{- include "pgedge-nla.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  {{- with .Values.server.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.server.service.type }}
  ports:
  - port: 8080
    targetPort: http
    protocol: TCP
    name: http
  selector:
    {{- include "pgedge-nla.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
