apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pgedge-nla.fullname" . }}-server
  labels:
    {{- include "pgedge-nla.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  # One replica only: the server keeps its users, tokens and sessions in its
  # data directory, which no two instances may share, and the volume is
  # ReadWriteOnce. Recreate stops the old pod before the new one mounts it.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "pgedge-nla.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.server.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "pgedge-nla.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: {{ include "pgedge-nla.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.server.podSecurityContext | nindent 8 }}
      # The server watches users.json and tokens.json for changes only when
      # they exist at startup, so create empty ones on first install; users
      # and tokens added later with kubectl exec then load without a restart.
      # Existing files are left alone.
      initContainers:
      - name: init-auth-files
        image: "{{ .Values.server.image.repository }}:{{ .Values.server.image.tag }}"
        imagePullPolicy: {{ .Values.server.image.pullPolicy }}
        command:
        - /bin/sh
        - -c
        - |
          cd {{ include "pgedge-nla.dataDir" . }}
          [ -e tokens.json ] || printf 'tokens: {}\n' > tokens.json
          [ -e users.json ] || printf 'users: {}\n' > users.json
        resources:
          {{- toYaml .Values.server.resources | nindent 10 }}
        securityContext:
          {{- toYaml .Values.server.securityContext | nindent 10 }}
        volumeMounts:
        - name: data
          mountPath: {{ include "pgedge-nla.dataDir" . }}
      containers:
      - name: server
        image: "{{ .Values.server.image.repository }}:{{ .Values.server.image.tag }}"
        imagePullPolicy: {{ .Values.server.image.pullPolicy }}
        # Run the server directly, because the image's entrypoint script
        # needs root.
        command: ["/app/pgedge-postgres-mcp"]
        args: ["-config", "/etc/pgedge/postgres-mcp.yaml"]
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: PGEDGE_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "pgedge-nla.fullname" . }}-secret
              key: postgres-password
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "pgedge-nla.fullname" . }}-secret
              key: anthropic-api-key
              optional: true
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "pgedge-nla.fullname" . }}-secret
              key: openai-api-key
              optional: true
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "pgedge-nla.fullname" . }}-secret
              key: gemini-api-key
              optional: true
        volumeMounts:
        - name: config
          mountPath: /etc/pgedge
          readOnly: true
        - name: data
          mountPath: {{ include "pgedge-nla.dataDir" . }}
        - name: tmp
          mountPath: /tmp
        {{- if and .Values.server.knowledgebase.enabled (not .Values.server.knowledgebase.useBuiltIn) }}
        # Mount external KB from PVC (only when useBuiltIn=false)
        - name: knowledgebase
          mountPath: /usr/share/pgedge/nla-kb
          readOnly: true
        {{- end }}
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          {{- toYaml .Values.server.resources | nindent 10 }}
        securityContext:
          {{- toYaml .Values.server.securityContext | nindent 10 }}
      volumes:
      - name: config
        configMap:
          name: {{ include "pgedge-nla.fullname" . }}-server-config
      - name: data
        {{- if .Values.server.persistence.enabled }}
        persistentVolumeClaim:
          claimName: {{ include "pgedge-nla.fullname" . }}-server-data
        {{- else }}
        emptyDir: {}
        {{- end }}
      - name: tmp
        emptyDir: {}
      {{- if and .Values.server.knowledgebase.enabled (not .Values.server.knowledgebase.useBuiltIn) }}
      # External KB volume (only when useBuiltIn=false)
      - name: knowledgebase
        persistentVolumeClaim:
          claimName: {{ .Values.server.knowledgebase.existingPvc }}
      {{- end }}
      {{- with .Values.server.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
