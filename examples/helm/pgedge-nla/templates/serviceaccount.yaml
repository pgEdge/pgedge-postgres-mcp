{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pgedge-nla.serviceAccountName" . }}
  labels:
    {{- include "pgedge-nla.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Neither component calls the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
