# Server configuration
server:
  image:
    repository: ghcr.io/pgedge/postgres-mcp
    # Empty means the chart's appVersion, with the -with-kb suffix when the
    # built-in knowledgebase is enabled; set a tag only to pin another one.
    tag: ""
    pullPolicy: IfNotPresent

  # The server always runs as a single replica; see the chart's README.

  # The Service is always named postgres-mcp on port 8080, because the web
  # image's nginx proxies to that address.
  service:
    type: ClusterIP
    annotations: {}

  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

  # Client address resolution, used for login rate limiting and logging.
  # Browser requests pass through two proxies, the ingress controller and a
  # web pod, so the connection's peer is a web pod rather than the caller.
  # Whilst trustedProxies is empty the server uses that peer, so every
  # browser login shares one rate limit per web pod. List the CIDR blocks
  # both proxies connect from (usually the cluster's pod network) to have
  # the server read the caller's address from X-Forwarded-For instead; see
  # the chart's README.
  clientIp:
    header: X-Forwarded-For
    trustedProxies: []

  # PostgreSQL connection; the password comes from secrets.postgresPassword.
  database:
    name: default
    host: postgres-postgresql
    port: 5432
    database: postgres
    user: postgres
    sslmode: prefer
    allowWrites: false

  # Extra web origins (scheme://host[:port]) the server accepts from
  # browsers. Each ingress host is already allowed; add any other address
  # the web client is published under.
  allowedOrigins: []

  # LLM proxy for the web client's chat. The API key for the provider comes
  # from secrets.anthropicApiKey, secrets.openaiApiKey or
  # secrets.geminiApiKey; Ollama needs none.
  llm:
    enabled: false
    # "anthropic", "openai", "ollama" or "gemini"
    provider: anthropic
    # Required for any provider other than anthropic; empty uses the
    # server's default Anthropic model.
    model: ""
    # The Ollama service's URL, when provider is "ollama"; empty uses
    # http://localhost:11434.
    ollamaUrl: ""

  # The documentation knowledgebase. Searching it embeds each query, so it
  # needs the embedding provider and model the knowledgebase was built
  # with; the API key comes from secrets.voyageApiKey, secrets.openaiApiKey
  # or secrets.geminiApiKey, and Ollama needs none.
  knowledgebase:
    enabled: false
    # true uses the knowledgebase built into the -with-kb image; false
    # mounts kb.db from the PVC named in existingPvc.
    useBuiltIn: true
    existingPvc: pgedge-nla-kb
    embedding:
      # "voyage", "openai", "gemini" or "ollama"; required when enabled.
      provider: ""
      # Empty uses the provider's default model.
      model: ""
      # The Ollama service's URL, when provider is "ollama"; empty uses
      # http://localhost:11434.
      ollamaUrl: ""

  # The data volume holds users.json, tokens.json, the authentication
  # database and conversation history. Without persistence they are lost
  # whenever the pod is replaced. helm uninstall keeps the claim; delete it
  # by hand to discard the data.
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""

  podAnnotations: {}
  # The image's mcp user; fsGroup makes the data volume writable by it.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true

  nodeSelector: {}
  tolerations: []
  affinity: {}

# Web UI configuration
web:
  image:
    repository: ghcr.io/pgedge/nla-web
    # Empty means the chart's appVersion.
    tag: ""
    pullPolicy: IfNotPresent

  # The web client is stateless, so it can run several replicas.
  replicaCount: 2

  service:
    type: ClusterIP
    port: 80
    annotations: {}

  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    fsGroup: 101

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true

  nodeSelector: {}
  tolerations: []
  affinity: {}

# Ingress configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: nla.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: pgedge-nla-tls
      hosts:
        - nla.example.com

# NetworkPolicies that admit traffic to the web pods only from the ingress
# controller, and to the server only from the web pods. They take effect
# only with a network plugin that enforces them.
networkPolicy:
  enabled: true
  # Selects the ingress controller's pods; the default matches the
  # ingress-nginx project's own install.
  ingressController:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: ingress-nginx
    podSelector:
      matchLabels:
        app.kubernetes.io/name: ingress-nginx

# Secrets
secrets:
  # PostgreSQL password (required)
  postgresPassword: ""

  # LLM API keys
  anthropicApiKey: ""
  openaiApiKey: ""
  geminiApiKey: ""
  # Knowledgebase embedding key for Voyage AI
  voyageApiKey: ""

# Service Account
serviceAccount:
  create: true
  annotations: {}
  name: ""
