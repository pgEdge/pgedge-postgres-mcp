# Server configuration
server:
  image:
    repository: ghcr.io/pgedge/postgres-mcp
    # Image tag options:
    #   - "latest"         Base image without knowledgebase
    #   - "latest-with-kb" Image with pre-built knowledgebase
    # Use "latest-with-kb" and set knowledgebase.useBuiltIn=true for easiest setup
    tag: latest-with-kb
    pullPolicy: IfNotPresent

  # The server always runs as a single replica; see the chart's README.

  # The Service is always named postgres-mcp on port 8080, because the web
  # image's nginx proxies to that address.
  service:
    type: ClusterIP
    annotations: {}

  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

  # Client address resolution, used for login rate limiting and logging.
  # Requests arrive through a Service or Ingress, so the connection's peer is
  # the proxy rather than the caller. List the addresses or CIDR blocks your
  # ingress controller connects from to have the server read the real client
  # address from the header below; whilst trustedProxies is empty the server
  # uses the connection's peer, which no caller can influence.
  clientIp:
    header: X-Real-IP
    trustedProxies: []

  # PostgreSQL connection; the password comes from secrets.postgresPassword.
  database:
    name: default
    host: postgres-postgresql
    port: 5432
    database: postgres
    user: postgres
    sslmode: prefer
    allowWrites: false

  # LLM proxy for the web client's chat. The API key for the provider comes
  # from secrets.anthropicApiKey or secrets.openaiApiKey.
  llm:
    enabled: false
    # "anthropic", "openai", "ollama" or "gemini"
    provider: anthropic
    # Leave empty to use the provider's default model.
    model: ""

  # Knowledgebase configuration
  # Options:
  #   1. Use -with-kb image variant (easiest): set useBuiltIn=true
  #   2. Use base image with external PVC: set useBuiltIn=false, provide existingPvc
  knowledgebase:
    enabled: true
    # Set to true when using the -with-kb image variant (KB built into image)
    # Set to false when using base image and mounting KB from a PVC
    useBuiltIn: true
    # Only used when useBuiltIn=false - name of existing PVC containing kb.db
    existingPvc: pgedge-nla-kb

  # The data volume holds users.json, tokens.json, the authentication
  # database and conversation history. Without persistence they are lost
  # whenever the pod is replaced.
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""

  podAnnotations: {}
  # The image's mcp user; fsGroup makes the data volume writable by it.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true

  nodeSelector: {}
  tolerations: []
  affinity: {}

# Web UI configuration
web:
  image:
    repository: ghcr.io/pgedge/nla-web
    tag: latest
    pullPolicy: IfNotPresent

  # The web client is stateless, so it can run several replicas.
  replicaCount: 2

  service:
    type: ClusterIP
    port: 80
    annotations: {}

  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    fsGroup: 101

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true

  nodeSelector: {}
  tolerations: []
  affinity: {}

# Ingress configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: nla.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: pgedge-nla-tls
      hosts:
        - nla.example.com

# Secrets
secrets:
  # PostgreSQL password (required)
  postgresPassword: ""

  # LLM API keys
  anthropicApiKey: ""
  openaiApiKey: ""

# Service Account
serviceAccount:
  create: true
  annotations: {}
  name: ""
