# Production configuration example
# Usage: helm install pgedge-nla ./pgedge-nla -f values-production.yaml
#
# The server runs as a single replica whatever these values say; see the
# chart's README for why. Supply the secrets at install time rather than
# keeping them in this file, for example with --set or a values file held
# in your secrets manager.

server:
  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 1000m
      memory: 1Gi

  persistence:
    enabled: true
    size: 5Gi
    storageClass: fast-ssd

web:
  replicaCount: 3

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
            - key: app.kubernetes.io/component
              operator: In
              values:
              - web
          topologyKey: kubernetes.io/hostname

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "90"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "90"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "90"
    nginx.ingress.kubernetes.io/rate-limit: "100"
  hosts:
    - host: nla.production.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: pgedge-nla-production-tls
      hosts:
        - nla.production.example.com
